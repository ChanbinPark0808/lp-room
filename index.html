<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LP">
    <meta name="theme-color" content="#1a1d24">
    <title>Taylor Swift LP</title>
    <link rel="icon" href="TemplateData/icon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="gate" class="gate">
      <form id="gate-form" class="card" autocomplete="off">
        <img class="logo" src="TemplateData/icon.png" alt="">
        <h1>Taylor Swift LP</h1>
        <p class="sub">비밀번호를 입력해 주세요</p>
        <input id="gate-password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <label class="remember"><input id="gate-remember" type="checkbox" checked> 이 기기에서 기억하기</label>
        <button id="gate-submit" type="submit">열기</button>
        <p id="gate-error" class="error" hidden></p>
      </form>
    </div>

    <div id="loading" class="gate" hidden>
      <div class="card">
        <img class="logo" src="TemplateData/icon.png" alt="">
        <h1>Taylor Swift LP</h1>
        <p id="loading-text" class="sub">불러오는 중…</p>
        <div class="bar"><div id="loading-bar"></div></div>
      </div>
    </div>

    <script src="TemplateData/tslp.js"></script>
    <script>
      (function () {
        var gate = document.getElementById('gate');
        var form = document.getElementById('gate-form');
        var password = document.getElementById('gate-password');
        var remember = document.getElementById('gate-remember');
        var submit = document.getElementById('gate-submit');
        var error = document.getElementById('gate-error');
        var loading = document.getElementById('loading');
        var loadingBar = document.getElementById('loading-bar');
        var loadingText = document.getElementById('loading-text');
        var started = false;

        function showError(text) {
          error.textContent = text;
          error.hidden = false;
        }

        function startUnity() {
          if (started) return;
          started = true;
          gate.hidden = true;
          loading.hidden = false;
          TSLP.audio.init();

          var script = document.createElement('script');
          script.src = 'Build/WebBuild.loader.js';
          script.onload = function () {
            createUnityInstance(document.getElementById('unity-canvas'), {
              arguments: [],
              dataUrl: 'Build/WebBuild.data.unityweb',
              frameworkUrl: 'Build/WebBuild.framework.js.unityweb',
              codeUrl: 'Build/WebBuild.wasm.unityweb',
              streamingAssetsUrl: 'StreamingAssets',
              companyName: "TaylorLP",
              productName: "Taylor Swift LP",
              productVersion: "1.0.0",
              devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),   // 고해상도 화면은 1.5배까지만 (iPad 성능)
            }, function (progress) {
              loadingBar.style.width = Math.round(progress * 100) + '%';
              loadingText.textContent = '불러오는 중… ' + Math.round(progress * 100) + '%';
            }).then(function (instance) {
              window.unityInstance = instance;
              loading.hidden = true;
            }).catch(function (message) {
              loadingText.textContent = '실행하지 못했어요: ' + message;
            });
          };
          script.onerror = function () { loadingText.textContent = '프로그램 파일을 받지 못했어요.'; };
          document.body.appendChild(script);
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          error.hidden = true;
          submit.disabled = true;
          submit.textContent = '확인 중…';
          TSLP.audio.init();             // 이 클릭으로 소리를 켤 수 있게
          TSLP.unlock(password.value, remember.checked).then(function () {
            password.value = '';
            startUnity();
          }).catch(function (err) {
            console.warn('[TSLP] 잠금 해제 실패', err);
            showError(err && err.name === 'OperationError' ? '비밀번호가 맞지 않아요.' : '열지 못했어요: ' + (err && err.message || err));
            submit.disabled = false;
            submit.textContent = '열기';
            password.select();
          });
        });

        // 로컬 테스트 전용: 테스트 사이트에만 있는 media/dev-unlock.json (배포할 때는 없음)
        function tryDevUnlock() {
          return fetch('media/dev-unlock.json', { cache: 'no-cache' }).then(function (res) {
            if (!res.ok) return false;
            return res.json().then(function (dev) { return TSLP.unlock(dev.password, false).then(function () { return true; }); });
          }).catch(function () { return false; });
        }

        TSLP.unlockRemembered().then(function (ok) {
          return ok || tryDevUnlock();
        }).then(function (ok) {
          if (ok) startUnity();
          else password.focus();
        });
      })();
    </script>
  </body>
</html>
